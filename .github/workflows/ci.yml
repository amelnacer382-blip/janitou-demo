name: CI — Tests & Persistance

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-suite:
    name: Tests API, PostgreSQL et authentification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: janitou_user
          POSTGRES_PASSWORD: janitou_dev_password
          POSTGRES_DB: janitou_food_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U janitou_user -d janitou_food_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://janitou_user:janitou_dev_password@localhost:5432/janitou_food_db?schema=public
      JANITOU_STORAGE: postgres
      BACKUP_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Configuration Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installation, Prisma et build
        run: |
          bun install
          bun run --cwd packages/database db:generate
          bun run --cwd packages/database db:migrate
          bun run build:bun

      - name: Tests automatisés
        run: bun test apps/api/test

      - name: E2E HTTP — authentification, persistance PostgreSQL, redémarrage
        run: |
          set -euo pipefail
          start_server() {
            bun apps/api/src/server.ts > server.log 2>&1 &
            echo $! > server.pid
            for _ in $(seq 1 30); do
              if curl -sf http://localhost:4000/health > /dev/null; then return 0; fi
              sleep 1
            done
            cat server.log
            return 1
          }

          start_server

          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/v1/customers)
          test "$STATUS" = "401"

          TOKEN=$(curl -s -X POST http://localhost:4000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@janitou.dz","password":"Admin@2026"}' | jq -r .token)
          test -n "$TOKEN"
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:4000/api/v1/customers > /dev/null

          curl -sf -X POST http://localhost:4000/api/v1/simple/dishes \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI persistence dish","category":"MAIN_COURSE","family":"TAGINE"}' > /dev/null

          kill -TERM "$(cat server.pid)"
          wait "$(cat server.pid)" 2>/dev/null || true
          start_server

          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:4000/api/v1/auth/me > /dev/null
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:4000/api/v1/simple/dishes \
            | jq -e '.dishes[] | select(.name == "CI persistence dish")' > /dev/null

          curl -sf http://localhost:4000/app > /dev/null
          curl -sf http://localhost:4000/client > /dev/null

          kill -TERM "$(cat server.pid)"
