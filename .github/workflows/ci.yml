
name: CI & Tests Automatisés

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-suite:
    name: Validation Tests Métier (17 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configuration Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installation & Build
        run: |
          bun install
          bun run build:bun

      - name: Exécution des 17 tests automatisés
        run: bun test apps/api/test

      - name: Test de démarrage et santé du serveur
        run: |
          bun apps/api/src/server.ts &
          SERVER_PID=$!
          sleep 3
          curl -f http://localhost:4000/health
          curl -f http://localhost:4000/dashboard > /dev/null
          kill $SERVER_PID
 
