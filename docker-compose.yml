services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: janitou_food_app
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-janitou_user}:${DB_PASSWORD:-janitou_dev_password}@postgres:5432/${DB_NAME:-janitou_food_db}?schema=public
    volumes:
      - janitou_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: janitou_food_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-janitou_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-janitou_dev_password}
      POSTGRES_DB: ${DB_NAME:-janitou_food_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/prisma/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-janitou_user} -d ${DB_NAME:-janitou_food_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: janitou_food_postgres_data
  janitou_data:
    name: janitou_food_app_data
