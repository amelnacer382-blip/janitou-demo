services:
  postgres:
    image: postgres:16-alpine
    container_name: janitou_food_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-janitou_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-janitou_dev_password}
      POSTGRES_DB: ${DB_NAME:-janitou_food_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/prisma/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-janitou_user} -d ${DB_NAME:-janitou_food_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: janitou_food_postgres_data
